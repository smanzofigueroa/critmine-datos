name: CritMine conector

on:
  schedule:
    - cron: "17 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Descargar datos
        env:
          BCCH_TOKEN: ${{ secrets.BCCH_TOKEN }}
        run: python conector.py
      - run: python generar_panel.py
      - name: Guardar cambios
        run: |
          git config user.name "critmine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos/datos.json datos/critmine.db panel.html
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          git push
